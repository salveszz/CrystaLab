[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalab"
version = "0.1.0"
description = "Illustrative 2D KDP crystallization simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9"]

[tool.setuptools.packages.find]
where = ["src"]
