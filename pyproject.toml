[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalab"
version = "0.1.0"
description = "Illustrative 3D KDP crystallization simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=9", "scipy>=1.12"]

[project.optional-dependencies]
vision = ["opencv-python>=4.10,<5"]

[tool.setuptools.packages.find]
where = ["src"]
